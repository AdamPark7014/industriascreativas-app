# HTTP → ACME + redirect; HTTPS → demo registro + Accesos PDA (TS API)
# Loaded alongside sistema-registro-eventos nginx (does not replace main site).
# Canonical live conf: zz-demo.conf (bind-mounted into nginx_registro_proxy).

server {
    listen 80;
    listen [::]:80;
    server_name demo.experiencebt.com.mx;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.experiencebt.com.mx;

    ssl_certificate     /etc/letsencrypt/live/demo.experiencebt.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.experiencebt.com.mx/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 20m;

    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 256;

    location = /api/escanear {
        set $accesos_backend "http://eventos_accesos_api:3080";
        proxy_pass $accesos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scan-Key $http_x_scan_key;
    }

    location = /api/zonas {
        set $accesos_backend "http://eventos_accesos_api:3080";
        proxy_pass $accesos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scan-Key $http_x_scan_key;
    }

    location / {
        set $demo_backend "http://eventos_demo_web:5000";
        proxy_pass $demo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
