# HTTP → ACME + redirect; HTTPS → Flask demo (eventos_demo_web)
# Loaded alongside sistema-registro-eventos nginx (does not replace main site).

server {
    listen 80;
    listen [::]:80;
    server_name demo.experiencebt.com.mx;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.experiencebt.com.mx;

    ssl_certificate     /etc/letsencrypt/live/demo.experiencebt.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.experiencebt.com.mx/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 20m;

    location / {
        set $demo_backend "http://eventos_demo_web:5000";
        proxy_pass $demo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
