# HTTP → ACME + redirect; HTTPS → PUMPKIN Accesos (pumpkin_accesos_web)
# Se carga junto a zz-demo.conf en el nginx compartido (nginx_registro_proxy).
#
# Desde el 29-10-2026 este dominio es de PUMPKIN (pumpkin/ en este repo), a pedido de Adam.
# FICTI (eventos_panel_web, eventos_accesos_api) sigue corriendo con su base, sin ruta
# pública. Su configuración anterior está en zz-panel.ficti.conf para volver a publicarlo.

server {
    listen 80;
    listen [::]:80;
    server_name panel.experiencebt.com.mx;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name panel.experiencebt.com.mx;

    ssl_certificate     /etc/letsencrypt/live/panel.experiencebt.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.experiencebt.com.mx/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 8m;

    gzip on;
    gzip_types application/json text/csv application/javascript text/css;
    gzip_min_length 256;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /pumpkin/ {
        set $pumpkin_backend "http://pumpkin_accesos_web:3090";
        proxy_pass $pumpkin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Las PDA que tenían guardadas las rutas de FICTI caen en la pantalla equivalente.
    location = /login {
        return 302 /pumpkin/login;
    }

    location = /logout {
        return 302 /pumpkin/login;
    }

    location ^~ /accesos {
        return 302 /pumpkin/escanear;
    }

    location / {
        return 302 /pumpkin/;
    }
}
