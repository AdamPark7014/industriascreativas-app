<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicio no disponible · Panel de control</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/panel.css') }}">
</head>
<body>
  <main class="loginPage">
    <div class="loginCard">
      <div class="loginHead">
        <div class="loginLogos">
          <img src="{{ url_for('static', filename='img/ficti-logo.png') }}" alt="FICTI">
          <img src="{{ url_for('static', filename='img/tech-capital-logo.png') }}" alt="Tech Capital">
        </div>
        <h1 class="loginTitulo">Servicio no disponible</h1>
        <p class="loginSub">No pudimos conectar con el servidor de registros</p>
      </div>
      <div class="loginBody">
        <div class="alerta">{{ detalle }}</div>
        <p class="loginPie">Ningún registro se ha perdido: el panel solo consulta información.
           Vuelve a intentar en unos segundos.</p>
        <a class="btn btnPrimario btnLogin" href="{{ url_for('panel') }}">Reintentar</a>
      </div>
    </div>
  </main>
</body>
</html>
